name: Update market data

on:
  schedule:
    # 미국 장 마감 뒤 (한국시간 06:27 / 07:47 / 10:17). GitHub가 가끔 예약 실행을 건너뛰어서 세 번 둠
    - cron: '27 21 * * 1-5'
    - cron: '47 22 * * 1-5'
    - cron: '17 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write   # data.json 저장

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install yfinance pandas requests

      - name: Fetch prices
        run: python update_data.py

      - name: Save data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git commit -m "market data $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
